name: Bootstrap portfolio lockfile

on:
  push:
    branches:
      - recruiter-hardening-2026-09

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v6
        with:
          ref: recruiter-hardening-2026-09

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Generate deterministic npm lockfile
        run: npm install --legacy-peer-deps --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lock modern portfolio dependencies"
          git push origin HEAD:recruiter-hardening-2026-09
